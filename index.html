<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Document Summarizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="../index.html" class="back">&larr; AI Interface Collection</a>
  </header>

  <main>
    <h1>AI Document Summarizer</h1>
    <p class="lead">Paste your text or upload a .txt file, then choose how short you want the summary.</p>

    <textarea id="input" rows="10" placeholder="Paste your document here..."></textarea>

    <div class="controls">
      <input type="file" id="file" accept=".txt">

      <label>
        Sentences:
        <input type="number" id="count" min="1" max="10" value="3">
      </label>

      <button id="go">Summarize</button>
    </div>

    <section id="result" hidden>
      <h2>Summary</h2>
      <p id="summary"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
